        return;
    }

    // Update Name in Header
    const nameHeader = document.querySelector('h3.font-headline-md');
    if (nameHeader) nameHeader.textContent = userData.name || 'User Name';

    // Update Grade Badge
    const gradeBadge = document.querySelector('.font-label-sm');
    if (gradeBadge) gradeBadge.textContent = userData.grade || 'N/A';

    // Update Full Name Detail
    const fullNameDetail = document.querySelector('.flex-col:nth-child(1) > .font-body-md');
    if (fullNameDetail) fullNameDetail.textContent = userData.name || 'User Name';
