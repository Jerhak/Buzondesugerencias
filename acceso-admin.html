<style>
body {
background-color: theme('colors.secondary');
}
.paper-card {
background: theme('colors.surface-container-lowest');
box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
border: 1px solid theme('colors.outline-variant');
position: relative;
}
.paper-card::before {
content: '';
position: absolute;
top: 0;
left: 0;
bottom: 0;
width: 4px;
background-color: theme('colors.primary');
border-top-left-radius: theme('borderRadius.xl');
border-bottom-left-radius: theme('borderRadius.xl');
}

/* Floating Avatar Container */
.avatar-float {
animation: float 6s ease-in-out infinite;
}
@keyframes float {
0% { transform: translateY(0px); }
50% { transform: translateY(-10px); }
100% { transform: translateY(0px); }
}
</style>
<style>
body {
min-height: max(884px, 100dvh);
}
</style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-container-padding-mobile">
<!-- Transactional Screen - No Global Nav Shells -->
<main class="w-full max-w-[400px] flex flex-col gap-gutter z-10 relative">
<!-- Header / Avatar Area -->
<div class="flex flex-col items-center text-center gap-base mb-4 relative">
<div class="avatar-float w-24 h-24 rounded-full border-4 border-surface-container-lowest shadow-lg overflow-hidden bg-primary-container flex items-center justify-center">
<span class="material-symbols-outlined text-4xl text-on-primary-container" data-icon="school">school</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-secondary">Acceso Administrativo</h1>
<p class="font-body-md text-body-md text-on-secondary opacity-90">Ingresa el código de seguridad para acceder al panel de control.</p>
</div>
<!-- Input Area (Paper Card Style) -->
<div class="paper-card rounded-xl p-gutter flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface-variant" for="rep-code">Código de Acceso</label>
<div class="relative">
<input class="w-full bg-surface text-center font-body-lg text-body-lg text-on-surface border-b-2 border-primary focus:outline-none focus:border-primary pb-2" id="rep-code" placeholder="Ingresa la palabra secreta" type="text" value=""/>
<!-- Example Error State (hidden by default) -->
<div class="absolute -bottom-6 left-0 flex items-center gap-1 text-error hidden" id="error-message">
<span class="material-symbols-outlined text-sm" data-icon="error">error</span>
<span class="font-label-sm text-label-sm">Código incorrecto. Intenta de nuevo.</span>
</div>
</div>
</div>
<!-- Action Area -->
<div class="mt-4">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-4 rounded-full shadow-md hover:scale-[0.98] transition-transform active:scale-95 flex items-center justify-center gap-2" onclick="if(document.getElementById('rep-code').value.trim().toLowerCase() === 'thalianaesperra') { document.getElementById('error-message').classList.add('hidden'); alert('Acceso concedido'); } else { document.getElementById('error-message').classList.remove('hidden'); }">Verificar y Entrar <span class="material-symbols-outlined text-sm" data-icon="login">login</span></button>
<button class="w-full mt-4 text-on-secondary font-label-sm text-label-sm py-2 opacity-80 hover:opacity-100 transition-opacity">Volver al inicio de sesión</button>
</div>
</main>
</body></html>
