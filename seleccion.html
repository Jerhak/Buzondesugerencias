<style>

<body class="bg-background text-on-background min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center p-container-padding-mobile md:p-container-padding-desktop">
<!-- Brand / Header -->
<div class="mb-12 flex flex-col items-center text-center space-y-4">
<div class="w-16 h-16 rounded-2xl bg-primary-container flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined fill-icon text-4xl text-on-primary-container">person_add</span>
</div>
<div>
<h1 class="font-headline-xl text-headline-lg-mobile md:text-headline-xl text-primary">Crear Perfil</h1>
<p class="font-body-lg text-body-lg text-secondary mt-2 max-w-md">Completa tus datos para unirte a Academic Pulse y participar en el consejo estudiantil.</p>
</div>
</div>
<!-- Profile Creation Form -->
<form action="seleccion.html" class="paper-texture w-full max-w-md bg-surface-container-lowest rounded-2xl p-8 border border-outline-variant/30 shadow-sm relative z-10 flex flex-col space-y-6">
<!-- Name Input -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface">Nombre Completo</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">person</span>
<input class="w-full bg-surface-container border border-outline-variant/50 focus:border-primary focus:ring-1 focus:ring-primary pl-12 pr-4 py-3 font-body-md text-body-md text-on-surface rounded-lg transition-colors outline-none" placeholder="Ej: Ana Pérez" required="" type="text"/>
</div>
</div>
<!-- Institutional ID Input -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface">ID Institucional</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">badge</span>
<input class="w-full bg-surface-container border border-outline-variant/50 focus:border-primary focus:ring-1 focus:ring-primary pl-12 pr-4 py-3 font-body-md text-body-md text-on-surface rounded-lg transition-colors outline-none" oninput="this.setCustomValidity('')" oninvalid="this.setCustomValidity('Por favor, ingresa tu ID Institucional')" placeholder="Ej: 2024-12345" required="" type="text"/>
</div>
</div>
<!-- Grade Selection -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface">Grado</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">school</span>
<select class="w-full bg-surface-container border border-outline-variant/50 focus:border-primary focus:ring-1 focus:ring-primary pl-12 pr-10 py-3 font-body-md text-body-md text-on-surface rounded-lg transition-colors outline-none appearance-none" required=""><option disabled="" selected="" value="">Selecciona tu grado</option><option value="901">901</option><option value="902">902</option><option value="903">903</option><option value="904">904</option><option value="905">905</option><option value="906">906</option></select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-4 px-4 rounded-full shadow-sm hover:scale-[0.98] hover:bg-primary/90 transition-all active:scale-95 flex items-center justify-center space-x-2 mt-4" type="submit">
<span>Continuar a Selección de Rol</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<!-- Decorative subtle background elements -->
<div class="fixed inset-0 pointer-events-none -z-10 overflow-hidden">
<div class="absolute -top-[20%] -right-[10%] w-[50%] h-[50%] rounded-full bg-primary-container/20 blur-3xl"></div>
<div class="absolute -bottom-[20%] -left-[10%] w-[60%] h-[60%] rounded-full bg-tertiary-container/10 blur-3xl"></div>
</div>
</main>
<script>
        function handleProfileCreation() {
            // Animate form submission
            const btn = document.querySelector('button[type="submit"]');
            btn.classList.add('scale-[0.98]');
            setTimeout(() => {
                btn.classList.remove('scale-[0.98]');
                // Navigate to role selection (mock)
                console.log('Profile created. Navigating to Role Selection...');
                alert('Perfil creado exitosamente. Redirigiendo a la selección de rol...');
            }, 150);
        }
    </script>
<style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
