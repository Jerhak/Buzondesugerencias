<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Registro - Perdón La Demora</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&amp;family=Space+Grotesk:wght@600&amp;display=swap" rel="stylesheet"/>

            darkMode: "class",
            theme: {

                    "colors": {

                        "inverse-surface": "#e2e2e8",

                        "surface-container-lowest": "#0c0e12",
                        "primary-fixed": "#d7e3ff",

                        "primary-fixed-dim": "#aac7ff",
                        "on-primary-container": "#dfe8ff",
                        "on-error-container": "#ffdad6",

                        "background": "#111318",
                        "error": "#ffb4ab",
                        "on-secondary-container": "#ddcdff",
                        "tertiary": "#00dbe7",
                        "on-surface": "#e2e2e8",
                        "surface-dim": "#111318",

                        "on-primary-fixed-variant": "#00458e",
                        "glass-white": "rgba(255, 255, 255, 0.08)",

<style>
        .mesh-bg {
            background-color: #001B3E;
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 102, 204, 0.4) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(112, 0, 255, 0.3) 0px, transparent 50%);
            background-attachment: fixed;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 0.5px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 60px 60px -10px rgba(0,0,0,0.3);
        }
        .glass-input {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-input:focus {
            border-color: rgba(170, 199, 255, 0.5);
            outline: none;
            box-shadow: 0 0 15px rgba(170, 199, 255, 0.2);
        }
        .btn-primary-glow {
            background: linear-gradient(135deg, #0066cc 0%, #7000ff 100%);
            box-shadow: 0 8px 32px rgba(0, 102, 204, 0.4);
            transition: all 0.3s ease;
        }
        .btn-primary-glow:hover {
            box-shadow: 0 12px 48px rgba(0, 102, 204, 0.6);
            transform: translateY(-2px);
        }
        /* Custom Select Styles */
        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e2e2e8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1em;
        }
        option {
            background-color: #1e2024;
            color: #e2e2e8;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="mesh-bg min-h-screen text-on-surface antialiased flex flex-col items-center justify-center p-4 md:p-container-padding-desktop">
<!-- Top Navigation Anchor (Suppressed nav links for transactional page, keeping brand) -->
<header class="fixed top-0 left-0 right-0 z-50 flex items-center justify-center px-6 py-4">
<div class="glass-panel rounded-full px-8 py-3 flex items-center gap-3">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">school</span>
<span class="font-headline-md text-headline-md text-primary font-bold tracking-tight">Perdón La Demora</span>
</div>
</header>
<main class="w-full max-w-md mt-20 relative z-10">
<!-- Welcome Header -->
<div class="text-center mb-10">
<h1 class="font-headline-xl text-headline-lg-mobile md:text-headline-xl text-on-surface mb-2 tracking-tight">Crear Perfil</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Únete a la comunidad de gestión escolar transparente.</p>
</div>
<!-- Registration Form Card -->
<div class="glass-panel rounded-[2rem] p-8">
<form action="#" class="flex flex-col gap-6" method="POST">
<!-- Nombre Completo -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="fullName">Nombre Completo</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">person</span>
<input class="glass-input w-full rounded-xl py-3 pl-12 pr-4 font-body-md text-body-md text-on-surface placeholder-outline transition-all" id="fullName" name="fullName" placeholder="Ej. Juan Pérez" required="" type="text"/>
</div>
</div>
<!-- ID Institucional -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="studentId">ID Institucional</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">badge</span>
<input class="glass-input w-full rounded-xl py-3 pl-12 pr-4 font-body-md text-body-md text-on-surface placeholder-outline transition-all" id="studentId" name="studentId" placeholder="Número de identificación" required="" type="text"/>
</div>
</div>
<!-- Selector de Grado -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="gradeLevel">Grado</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline pointer-events-none">groups</span>
<select class="glass-input w-full rounded-xl py-3 pl-12 pr-10 font-body-md text-body-md text-on-surface transition-all cursor-pointer" id="gradeLevel" name="gradeLevel" required="">
<option disabled="" selected="" value="">Selecciona tu grado</option>
<option value="901">901</option>
<option value="902">902</option>
<option value="903">903</option>
<option value="904">904</option>
<option value="905">905</option>
<option value="906">906</option>
</select>
</div>
</div>
<!-- Botón Crear Perfil -->
<button class="btn-primary-glow w-full rounded-full py-4 mt-4 flex items-center justify-center gap-2 group" type="submit">
<span class="font-label-md text-label-md text-white">Crear Perfil</span>
<span class="material-symbols-outlined text-white group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
<div class="mt-8 text-center border-t border-glass-border pt-6">
<p class="font-body-md text-body-md text-on-surface-variant text-sm">
                    ¿Ya tienes una cuenta? <a class="text-primary hover:text-primary-fixed transition-colors font-medium" href="#">Inicia sesión</a>
</p>
</div>
</div>
</main>
<!-- Decorative floating elements -->
<div class="fixed top-20 left-10 w-32 h-32 bg-primary/20 rounded-full blur-[60px] -z-10 pointer-events-none"></div>
<div class="fixed bottom-20 right-10 w-48 h-48 bg-secondary-container/20 rounded-full blur-[80px] -z-10 pointer-events-none"></div>
</body></html>
