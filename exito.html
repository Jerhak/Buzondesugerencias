<style>
        .paper-texture {
            background-color: #ffffff;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.02'/%3E%3C/svg%3E");
        }
        .squishy-hover {
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .squishy-hover:active {
            transform: scale(0.96);
        }
        .animate-bounce-in {
            animation: bounceIn 0.6s cubic-bezier(0.68, -0.55, 0.26, 1.55) forwards;
        }
        @keyframes bounceIn {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-secondary-container min-h-screen flex flex-col items-center justify-center font-body-lg text-on-surface overflow-hidden relative">
<!-- Ambient background gradient effect -->
<div class="absolute inset-0 bg-gradient-to-br from-surface to-secondary-container opacity-80 pointer-events-none z-0"></div>
<!-- Main Content Card (Paper Morphism) -->
<main class="w-[90%] max-w-sm bg-surface-container-lowest paper-texture rounded-[24px] shadow-[0_10px_30px_rgba(0,0,0,0.05),0_1px_3px_rgba(0,0,0,0.02)] border border-outline-variant/20 p-8 flex flex-col items-center text-center relative z-10 squishy-hover" style="transform: rotate(-1deg); transition: transform 0.3s ease;">
<!-- Icon Container -->
<div class="w-24 h-24 bg-primary-container rounded-full flex items-center justify-center mb-6 shadow-md animate-bounce-in">
<span class="material-symbols-outlined text-on-primary-container" style="font-size: 48px; font-variation-settings: 'FILL' 1;">
                mark_email_read
            </span>
</div>
<!-- Success Message -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-3 tracking-tight">
            ¡Propuesta enviada con éxito!
        </h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-6 px-2">
            Tu sugerencia ya está en el buzón virtual del Consejo Estudiantil. ¡Gracias por participar!
        </p>
<!-- Status Badge -->
<div class="bg-tertiary-container text-on-tertiary-container font-label-md text-label-md py-2 px-4 rounded-full mb-8 shadow-sm flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">
                history
            </span>
            Te queda 1 propuesta hoy
        </div>
<!-- Action Buttons -->
<div class="w-full flex flex-col gap-3">
<a class="w-full bg-primary hover:bg-surface-tint text-on-primary font-label-md text-label-md py-4 rounded-xl squishy-hover shadow-sm transition-colors flex justify-center items-center gap-2" href="propuesta.html">
<span class="material-symbols-outlined text-[20px]">
                    add_circle
                </span>
                Enviar otra propuesta
            </a>
<a class="w-full bg-surface-variant hover:bg-surface-container-highest text-on-surface-variant font-label-md text-label-md py-4 rounded-xl squishy-hover transition-colors flex justify-center items-center gap-2" href="index.html">
<span class="material-symbols-outlined text-[20px]">
                    home
                </span>
                Volver al Inicio
            </a>
</div>
</main>
<script>
        // Simple subtle interaction script to reset rotation on hover for a tactile feel
        const card = document.querySelector('main');
        card.addEventListener('mouseenter', () => {
            card.style.transform = 'rotate(0deg)';
        });
        card.addEventListener('mouseleave', () => {
            card.style.transform = 'rotate(-1deg)';
        });
    </script>
</body></html>
