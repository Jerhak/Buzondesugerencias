<style>
        .mesh-bg {
            background-color: #001B3E;
            background-image: 
                radial-gradient(at 40% 20%, hsla(213,100%,40%,0.3) 0px, transparent 50%),
                radial-gradient(at 80% 0%, hsla(189,100%,56%,0.2) 0px, transparent 50%),
                radial-gradient(at 0% 50%, hsla(263,100%,60%,0.3) 0px, transparent 50%);
            background-attachment: fixed;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 0.5px solid rgba(255, 255, 255, 0.15);
        }
        .glass-panel-elevated {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 0.5px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 60px 60px -10px rgba(0,0,0,0.3);
        }
        
        @keyframes success-pulse {
            0% { box-shadow: 0 0 0 0 rgba(170, 199, 255, 0.4); }
            70% { box-shadow: 0 0 0 40px rgba(170, 199, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(170, 199, 255, 0); }
        }
        .animate-success {
            animation: success-pulse 2s infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background mesh-bg min-h-screen flex flex-col font-body-md overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Navigation Anchor (Hidden on transactional/success flow) -->
<header class="hidden md:flex fixed top-0 left-0 right-0 z-50 items-center justify-between px-6 py-3 bg-glass-white backdrop-blur-[20px] border-[0.5px] border-glass-border rounded-full mt-4 mx-4 shadow-[0_60px_60px_-10px_rgba(0,0,0,0.3)]">
<div class="flex items-center gap-3">
<span class="font-headline-md text-headline-md font-bold text-primary">Perdón La Demora</span>
</div>
<div class="flex items-center gap-6">
<!-- Navigation hidden due to task-focused intent -->
</div>
</header>
<!-- Main Canvas -->
<main class="flex-grow flex items-center justify-center p-container-padding-mobile md:p-container-padding-desktop w-full max-w-4xl mx-auto relative z-10 pt-24 pb-32 md:py-32">
<!-- Success Container -->
<div class="glass-panel-elevated rounded-xl p-8 md:p-12 w-full flex flex-col items-center text-center max-w-2xl transform transition-all duration-700 hover:scale-[1.01]">
<!-- Hero Icon -->
<div class="relative w-32 h-32 md:w-40 md:h-40 rounded-full bg-primary-container/20 flex items-center justify-center mb-8 border border-glass-border animate-success">
<span class="material-symbols-outlined text-primary text-6xl md:text-8xl drop-shadow-[0_0_15px_rgba(170,199,255,0.6)]" style="font-variation-settings: 'FILL' 1;">
                    check_circle
                </span>
<!-- Inner glow -->
<div class="absolute inset-0 rounded-full bg-gradient-to-tr from-primary/10 to-transparent"></div>
</div>
<!-- Content -->
<h1 class="font-headline-xl text-headline-xl text-on-surface mb-4">
                ¡Propuesta enviada con éxito!
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-12 max-w-md mx-auto">
                Tu propuesta ha sido registrada y será revisada por el equipo pronto. Gracias por participar.
            </p>
<!-- Actions -->
<div class="flex flex-col sm:flex-row gap-4 w-full justify-center">
<button class="bg-gradient-to-r from-primary-container to-inverse-primary text-on-primary-container font-label-md text-label-md py-4 px-8 rounded-full shadow-[0_10px_30px_-10px_rgba(0,102,204,0.5)] hover:scale-105 active:scale-95 transition-all w-full sm:w-auto flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-lg">add_circle</span>
                    Enviar otra propuesta
                </button>
<button class="glass-panel text-primary font-label-md text-label-md py-4 px-8 rounded-full hover:bg-glass-white/20 hover:text-on-surface active:scale-95 transition-all border-[1.5px] border-glass-border w-full sm:w-auto flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-lg">home</span>
                    Volver al Inicio
                </button>
</div>
</div>
</main>
<!-- Background Atmospheric Particles -->
<div aria-hidden="true" class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
<div class="absolute top-1/4 left-1/4 w-96 h-96 bg-primary/10 rounded-full blur-[100px] animate-pulse"></div>
<div class="absolute bottom-1/4 right-1/4 w-[30rem] h-[30rem] bg-tertiary/10 rounded-full blur-[120px]" style="animation: pulse 8s cubic-bezier(0.4, 0, 0.6, 1) infinite;"></div>
</div>
