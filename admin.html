<script>
const container = document.getElementById('proposals-container');

function getProposals() {
    const stored = localStorage.getItem('school_proposals');
    return stored ? JSON.parse(stored) : [];
}

function deleteProposal(index) {
    const proposals = getProposals();
    proposals.splice(index, 1);
    localStorage.setItem('school_proposals', JSON.stringify(proposals));
    renderProposals();
}

function reviewProposal(index) {
    const proposals = getProposals();
    const p = proposals[index];
    alert(`Detalles de la Propuesta:\n\nCategoría: ${p.category}\nTítulo: ${p.title}\n\n${p.description}`);
}

function renderProposals() {
    const proposals = getProposals();
    container.innerHTML = '';

    if (proposals.length === 0) {
        container.innerHTML = `
            <div class="flex flex-col items-center justify-center py-12 text-outline opacity-70">
                <span class="material-symbols-outlined text-6xl mb-4">inbox</span>
                <p class="font-body-lg">No hay propuestas todavía</p>
            </div>`;
        return;
    }

    proposals.forEach((p, index) => {
        const article = document.createElement('article');
        article.className = 'paper-texture rounded-xl p-5 relative border-l-4 border-l-primary transition-transform duration-300';
        
        // Alternate rotations for aesthetic
        const rotation = index % 2 === 0 ? '-rotate-1' : 'rotate-1';
        article.classList.add(rotation, 'hover:rotate-0');

        article.innerHTML = `
            <div class="flex items-center gap-2 mb-3">
                <span class="bg-secondary-container text-primary rounded-full px-3 py-1 font-label-sm text-label-sm uppercase tracking-wider">${p.category || 'General'}</span>
                <span class="font-label-sm text-label-sm text-outline">${p.timestamp || 'Reciente'}</span>
            </div>
            <h3 class="font-headline-md text-headline-md-mobile text-on-surface mb-2 leading-tight">${p.title}</h3>
            <p class="font-body-md text-body-md text-on-surface-variant line-clamp-2 mb-4">${p.description}</p>
            <div class="flex items-center justify-end border-t border-outline-variant/20 pt-3">
                <div class="flex gap-2">
                    <button onclick="reviewProposal(${index})" class="bg-primary text-on-primary px-3 py-1 rounded-full font-label-sm text-label-sm active:scale-95 transition-transform">Revisar</button>
                    <button onclick="deleteProposal(${index})" class="text-error font-label-sm text-label-sm hover:underline active:scale-95 transition-transform">Eliminar</button>
                </div>
            </div>
        `;
        container.appendChild(article);
    });
}

// Initial render
document.addEventListener('DOMContentLoaded', renderProposals);
</script></body></html>
