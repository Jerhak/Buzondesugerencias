<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Dashboard - Student Council</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-bg-start': '#0f172a',
                        'brand-bg-end': '#1e1b4b',
                        'glass-panel': 'rgba(255, 255, 255, 0.05)',
                        'glass-border': 'rgba(255, 255, 255, 0.1)',
                        'neon-cyan': '#06b6d4',
                        'neon-purple': '#a855f7',
                        'neon-blue': '#3b82f6',
                        'text-primary': '#f8fafc',
                        'text-secondary': '#94a3b8',
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
<style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        .glow-border-cyan {
            border: 1px solid rgba(6, 182, 212, 0.5);
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.2);
        }
        .glow-border-purple {
            border: 1px solid rgba(168, 85, 247, 0.5);
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.2);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-brand-bg-start to-brand-bg-end text-text-primary antialiased pb-28 min-h-[100dvh] font-sans">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 glass-card border-b-0 border-glass-border px-5 py-4 h-[72px] flex justify-between items-center">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full overflow-hidden border border-neon-cyan/50 shadow-[0_0_10px_rgba(6,182,212,0.3)]">
<img alt="Student Avatar" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAGGABCFMUhdh5nr4cRA2lMH3RsKMEUBVBPSbm4SE0iivUH1sR29Pv9bQ3U0OHOGLko2HYbxJyqcEktFWBpeLIBygRBYmvhJeAYoPEcfnEjQfIL6Y1Wv_926n47vAJhR761FBcQDobr-tu3-y499XaPrshGMui78skhesjvbZqulc1ArWtU5Ls4N7pNJoL-J15TIOwcLrKTWYiPOMoTz5CLCq2HdgdjkZT3MQUUrN0y2ebLwQFALUA"/>
</div>
<div>
<h1 class="text-lg font-bold text-transparent bg-clip-text bg-gradient-to-r from-neon-cyan to-neon-purple tracking-tight leading-tight">Admin Panel</h1>
<p class="text-xs text-text-secondary" id="userNameDisplay">Loading...</p>
</div>
</div>
<div class="relative">
<button class="w-10 h-10 flex items-center justify-center rounded-full text-neon-cyan hover:bg-glass-panel transition-colors active:scale-95 duration-100" id="settingsBtn">
<span class="material-symbols-outlined">settings</span>
</button>
<div class="hidden absolute right-0 mt-2 w-48 glass-card rounded-xl py-2 z-50 border border-neon-purple/30 shadow-[0_0_15px_rgba(168,85,247,0.15)]" id="settingsMenu">
<a class="block px-4 py-2 text-sm text-text-primary hover:bg-glass-panel transition-colors" href="#">Mi Perfil</a>
<a class="block px-4 py-2 text-sm text-red-400 hover:bg-glass-panel transition-colors" href="index.html">Cerrar sesión</a>
</div>
</div>
</header>
<!-- Main Canvas -->
<main class="mt-[80px] px-5 max-w-md mx-auto relative z-10">
<!-- Welcome & Search -->
<section class="mb-6">
<h2 class="text-sm font-medium text-text-secondary mb-4 uppercase tracking-wider">Gestión de Propuestas Recibidas</h2>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-text-secondary group-focus-within:text-neon-cyan transition-colors">search</span>
<input class="w-full bg-glass-panel border border-glass-border focus:border-neon-cyan focus:ring-0 px-4 py-3 pl-12 rounded-xl shadow-inner text-sm text-text-primary outline-none transition-all placeholder:text-text-secondary" placeholder="Search ideas..." type="text"/>
</div>
</section>
<!-- Filters (Chips) -->
<section class="mb-6">
<div class="flex overflow-x-auto gap-3 pb-2 no-scrollbar">
<button class="bg-gradient-to-r from-neon-cyan to-neon-blue text-white rounded-full px-5 py-2 text-xs font-semibold whitespace-nowrap shadow-[0_0_10px_rgba(6,182,212,0.4)] transition-transform active:scale-95">All Ideas</button>
<button class="glass-card text-neon-cyan rounded-full px-5 py-2 text-xs font-semibold whitespace-nowrap hover:bg-glass-panel hover:text-white transition-colors active:scale-95 border border-neon-cyan/30">Facilities</button>
<button class="glass-card text-neon-purple rounded-full px-5 py-2 text-xs font-semibold whitespace-nowrap hover:bg-glass-panel hover:text-white transition-colors active:scale-95 border border-neon-purple/30">Events</button>
<button class="glass-card text-neon-blue rounded-full px-5 py-2 text-xs font-semibold whitespace-nowrap hover:bg-glass-panel hover:text-white transition-colors active:scale-95 border border-neon-blue/30">Curriculum</button>
</div>
</section>
<!-- Suggestions Stack -->
<section class="flex flex-col gap-4 relative" id="proposalsContainer">
<p class="hidden text-center text-text-secondary text-sm py-8" id="emptyState">No hay propuestas pendientes</p>
<!-- Dynamic cards will be injected here -->
</section>
</main>
<!-- BottomNavBar -->
<nav class="glass-card border-t-0 border-glass-border fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-3 rounded-t-2xl">
<a class="group flex flex-col items-center justify-center w-16 active:scale-[0.98] transition-transform duration-200" href="index.html">
<div class="flex flex-col items-center justify-center text-neon-cyan rounded-2xl px-4 py-1 mb-1 shadow-[0_0_15px_rgba(6,182,212,0.2)] bg-glass-panel border border-neon-cyan/20">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
</div>
<span class="text-[10px] font-semibold text-neon-cyan mt-1">Inicio</span>
</a>
<a class="group flex flex-col items-center justify-center w-16 active:scale-[0.98] transition-transform duration-200 opacity-60 hover:opacity-100" href="#">
<div class="flex flex-col items-center justify-center text-text-secondary rounded-2xl px-4 py-1 mb-1 group-hover:text-neon-purple transition-colors">
<span class="material-symbols-outlined">add_circle</span>
</div>
<span class="text-[10px] font-medium text-text-secondary group-hover:text-neon-purple mt-1 transition-colors">Propuestas</span>
</a>
<a class="group flex flex-col items-center justify-center w-16 active:scale-[0.98] transition-transform duration-200 opacity-60 hover:opacity-100" href="#">
<div class="flex flex-col items-center justify-center text-text-secondary rounded-2xl px-4 py-1 mb-1 group-hover:text-neon-blue transition-colors">
<span class="material-symbols-outlined">history</span>
</div>
<span class="text-[10px] font-medium text-text-secondary group-hover:text-neon-blue mt-1 transition-colors">Historial</span>
</a>
</nav>
<!-- Ambient Background Elements -->
<div class="fixed top-[-10%] left-[-10%] w-96 h-96 bg-neon-purple/20 rounded-full blur-[100px] pointer-events-none z-0"></div>
<div class="fixed bottom-[-10%] right-[-10%] w-96 h-96 bg-neon-cyan/20 rounded-full blur-[100px] pointer-events-none z-0"></div>
<script>
        // Initialize User Name
        const userName = localStorage.getItem('userName') || 'Admin User';
        document.getElementById('userNameDisplay').textContent = userName;

        document.addEventListener('DOMContentLoaded', () => {
            // Settings Menu Toggle
            const settingsBtn = document.getElementById('settingsBtn');
            const settingsMenu = document.getElementById('settingsMenu');
            
            settingsBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                settingsMenu.classList.toggle('hidden');
            });

            document.addEventListener('click', (e) => {
                if (!settingsBtn.contains(e.target) && !settingsMenu.contains(e.target)) {
                    settingsMenu.classList.add('hidden');
                }
            });

            renderProposals();
        });

        function getProposals() {
            const proposalsJSON = localStorage.getItem('sugerencias');
            return proposalsJSON ? JSON.parse(proposalsJSON) : [];
        }

        function renderProposals() {
            const container = document.getElementById('proposalsContainer');
            const emptyState = document.getElementById('emptyState');
            const proposals = getProposals();

            Array.from(container.children).forEach(child => {
                if (child.id !== 'emptyState') {
                    child.remove();
                }
            });

            if (proposals.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            proposals.forEach((proposal, index) => {
                const category = proposal.category || 'General';
                const isFacilities = category.toLowerCase() === 'facilities';
                const isEvents = category.toLowerCase() === 'events';
                const isCurriculum = category.toLowerCase() === 'curriculum';
                
                let glowClass = 'glow-border-blue';
                let tagColorClass = 'text-neon-blue border-neon-blue/40 bg-neon-blue/10';
                
                if (isFacilities) {
                    glowClass = 'glow-border-cyan';
                    tagColorClass = 'text-neon-cyan border-neon-cyan/40 bg-neon-cyan/10';
                }
                if (isEvents) {
                    glowClass = 'glow-border-purple';
                    tagColorClass = 'text-neon-purple border-neon-purple/40 bg-neon-purple/10';
                }

                const card = document.createElement('article');
                card.className = `glass-card rounded-2xl p-5 relative ${glowClass} transition-all duration-300 hover:shadow-lg backdrop-blur-md`;
                
                card.innerHTML = `
                    ${proposal.pinned ? `
                    <div class="absolute top-4 right-4 text-neon-purple drop-shadow-[0_0_5px_rgba(168,85,247,0.5)]">
                    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">push_pin</span>
                    </div>
                    ` : ''}
                    <div class="flex items-center gap-3 mb-4">
                        <span class="border rounded-full px-3 py-1 text-[10px] font-bold uppercase tracking-wider ${tagColorClass}">${category}</span>
                        <span class="text-[11px] text-text-secondary">${proposal.time || 'Reciente'}</span>
                    </div>
                    <h3 class="text-lg font-bold text-text-primary mb-2 leading-tight">${proposal.title || proposal.titulo || 'Sin Título'}</h3>
                    <p class="text-sm text-text-secondary line-clamp-2 mb-5 leading-relaxed">${proposal.description || proposal.descripcion || ''}</p>
                    <div class="flex items-center justify-between border-t border-glass-border pt-4 mt-2">
                        <div class="flex items-center gap-1.5 text-neon-cyan">
                            <span class="material-symbols-outlined text-[18px]">thumb_up</span>
                            <span class="text-sm font-semibold">${proposal.upvotes || 0}</span>
                        </div>
                        <div class="flex gap-3">
                            <button class="bg-glass-panel border border-glass-border text-text-primary hover:bg-neon-cyan/20 hover:border-neon-cyan/50 px-4 py-1.5 rounded-full text-xs font-semibold transition-all">Revisar</button>
                            <button onclick="deleteProposal(${proposal.id})" class="text-red-400 text-xs font-semibold hover:text-red-300 transition-colors">Eliminar</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.deleteProposal = function(id) {
            let proposals = getProposals();
            proposals = proposals.filter(p => p.id !== id);
            localStorage.setItem('sugerencias', JSON.stringify(proposals));
            renderProposals();
        };
    </script>
</body></html>
