<!-- Welcome & Search -->
<section class="mb-6">
<h2 class="font-body-lg text-body-lg text-on-surface-variant mb-4">Gestión de Propuestas Recibidas</h2>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">search</span>
<input class="w-full bg-surface-container-lowest border-b-2 border-transparent border-b-outline-variant focus:border-b-primary focus:ring-0 px-4 py-4 pl-12 rounded-t-lg shadow-sm font-body-md text-body-md text-on-surface outline-none transition-all placeholder:text-outline/70" placeholder="Search ideas..." type="text"/>
</div>

<!-- Filters (Chips) -->

<div class="flex overflow-x-auto gap-2 pb-2 no-scrollbar">
<button class="bg-primary text-on-primary rounded-full px-5 py-2 font-label-md text-label-md whitespace-nowrap shadow-md transition-transform active:scale-95">All Ideas</button>

<button class="bg-secondary-container text-primary rounded-full px-5 py-2 font-label-md text-label-md whitespace-nowrap shadow-sm hover:bg-surface-tint/10 transition-colors active:scale-95">Events</button>
<button class="bg-secondary-container text-primary rounded-full px-5 py-2 font-label-md text-label-md whitespace-nowrap shadow-sm hover:bg-surface-tint/10 transition-colors active:scale-95">Curriculum</button>
</div>
</section>
<!-- Suggestions Stack -->
<section class="flex flex-col gap-4 relative"><div class="flex flex-col gap-4" id="proposals-container"></div><script>
(function() {
  const container = document.getElementById('proposals-container');
  const proposals = JSON.parse(localStorage.getItem('proposals') || '[]');
  
  if (proposals.length === 0) {
    container.innerHTML = `<div class="text-center py-12"><span class="material-symbols-outlined text-outline text-6xl mb-4">inbox</span><p class="font-body-lg text-on-surface-variant">No hay propuestas todavía</p></div>`;
    return;
  }

  container.innerHTML = proposals.map((p, index) => {
    const rotation = index % 2 === 0 ? '-rotate-1' : 'rotate-1';
    const borderColor = index % 3 === 0 ? 'border-l-primary' : (index % 3 === 1 ? 'border-l-tertiary' : 'border-l-primary/60');
    const categoryBg = p.category === 'Events' ? 'bg-tertiary-container/20 text-tertiary' : 'bg-secondary-container text-primary';
    
    return `
      <article class="paper-texture rounded-xl p-5 relative border-l-4 ${borderColor} ${rotation} hover:rotate-0 transition-transform duration-300">
        <div class="flex items-center gap-2 mb-3">
          <span class="${categoryBg} rounded-full px-3 py-1 font-label-sm text-label-sm uppercase tracking-wider">${p.category || 'General'}</span>
          <span class="font-label-sm text-label-sm text-outline">Reciente</span>
        </div>
        <h3 class="font-headline-md text-headline-md-mobile text-on-surface mb-2 leading-tight">${p.title}</h3>
        <p class="font-body-md text-body-md text-on-surface-variant line-clamp-2 mb-4">${p.description || p.content || ''}</p>
        <div class="flex items-center justify-between border-t border-outline-variant/20 pt-3">
          <div class="flex items-center gap-1 text-primary">
            <span class="material-symbols-outlined text-[20px]">thumb_up</span>
            <span class="font-label-md text-label-md">0</span>
          </div>
          <div class="flex gap-2">
            <button class="bg-primary text-on-primary px-3 py-1 rounded-full font-label-sm text-label-sm">Revisar</button>
            <button class="text-error font-label-sm text-label-sm hover:underline">Eliminar</button>
          </div>
        </div>
      </article>`;
  }).join('');
})();
</script></section>
