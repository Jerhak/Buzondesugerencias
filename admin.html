<script>
const supabaseUrl = 'https://onjqxbyrtaknrirqulik.supabase.co';
const supabaseKey = 'sb_publishable_v4IUYnEKDTckE6hFIKJBcg_nb1wZjbW';
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

const container = document.getElementById('proposals-container');
const searchInput = document.getElementById('searchInput');

let localProposals = [];
let filteredProposals = [];

// Dropdown Toggle
const settingsMenuBtn = document.getElementById('settingsMenuBtn');
const settingsDropdown = document.getElementById('settingsDropdown');

settingsMenuBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    settingsDropdown.classList.toggle('hidden');
});

document.addEventListener('click', (e) => {
    if (!settingsMenuBtn.contains(e.target) && !settingsDropdown.contains(e.target)) {
        settingsDropdown.classList.add('hidden');
    }
});

async function getProposals() {
    try {
        const { data, error } = await supabase
            .from('propuestas')
            .select('*')
            .order('created_at', { ascending: false });
        if (error) throw error;
        localProposals = data || [];
        filterAndRenderProposals();
    } catch (error) {
        console.error('Error fetching proposals:', error);
    }
}

function filterAndRenderProposals() {
    const query = searchInput.value.toLowerCase();
    filteredProposals = localProposals.filter(p => 
        (p.title && p.title.toLowerCase().includes(query)) || 
        (p.description && p.description.toLowerCase().includes(query)) ||
        (p.category && p.category.toLowerCase().includes(query))
    );
    renderProposals();
}

searchInput.addEventListener('input', filterAndRenderProposals);

async function deleteProposal(id) {
    try {
        const { error } = await supabase
            .from('propuestas')
            .delete()
            .eq('id', id);
        if (error) throw error;
        // Realtime will pick up the deletion
    } catch (error) {
        console.error('Error deleting proposal:', error);
    }
}

function reviewProposal(index) {
    const p = filteredProposals[index];
    if (p) {
        alert(`Detalles de la Propuesta:\n\nCategoría: ${p.category}\nTítulo: ${p.title}\n\n${p.description}`);
    }
}

function renderProposals() {
    container.innerHTML = '';

    if (filteredProposals.length === 0) {
        container.innerHTML = `
            <div class="flex flex-col items-center justify-center py-12 text-outline opacity-70">
                <span class="material-symbols-outlined text-6xl mb-4">inbox</span>
                <p class="font-body-lg">No hay propuestas pendientes</p>
            </div>`;
        return;
    }

    filteredProposals.forEach((p, index) => {
        const article = document.createElement('article');
        article.className = 'liquid-glass rounded-xl p-5 relative border-l-4 border-l-primary transition-transform duration-300';
        
        // Alternate rotations for aesthetic
        const rotation = index % 2 === 0 ? '-rotate-1' : 'rotate-1';
        article.classList.add(rotation, 'hover:rotate-0');

        article.innerHTML = `
            <div class="flex items-center gap-2 mb-3">
                <span class="bg-secondary-container/80 text-primary rounded-full px-3 py-1 font-label-sm text-label-sm uppercase tracking-wider">${p.category || 'General'}</span>
                <span class="font-label-sm text-label-sm text-outline">${p.created_at ? new Date(p.created_at).toLocaleDateString() : 'Reciente'}</span>
            </div>
            <h3 class="font-headline-md text-headline-md-mobile text-on-surface mb-2 leading-tight">${p.title || 'Sin título'}</h3>
            <p class="font-body-md text-body-md text-on-surface-variant line-clamp-2 mb-4">${p.description || ''}</p>
            <div class="flex items-center justify-end border-t border-outline-variant/20 pt-3">
                <div class="flex gap-2">
                    <button onclick="reviewProposal(${index})" class="bg-primary text-on-primary px-3 py-1 rounded-full font-label-sm text-label-sm active:scale-95 transition-transform shadow-md">Revisar</button>
                    <button onclick="deleteProposal('${p.id}')" class="text-error font-label-sm text-label-sm hover:underline active:scale-95 transition-transform">Eliminar</button>
                </div>
            </div>
        `;
        container.appendChild(article);
    });
}

function setupRealtime() {
    supabase
        .channel('public:propuestas')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'propuestas' }, payload => {
            console.log('Cambio detectado en tiempo real', payload);
            getProposals();
        })
        .subscribe();
}

// Initial fetch and setup
document.addEventListener('DOMContentLoaded', () => {
    getProposals();
    setupRealtime();
});
</script></body></html>
