<script>
        // Simple chip selection interaction
        document.addEventListener('DOMContentLoaded', () => {
            const chips = document.querySelectorAll('.bg-secondary-container, .bg-primary');
            chips.forEach(chip => {
                chip.addEventListener('click', function(e) {
                    if(e.target.tagName !== 'BUTTON') return;
                    
                    // Reset all chips to secondary
                    chips.forEach(c => {
                        c.classList.remove('bg-primary', 'text-on-primary', 'border-transparent');
                        c.classList.add('bg-secondary-container', 'text-on-secondary-container', 'border-outline-variant/20');
                    });
                    
                    // Set clicked chip to primary
                    this.classList.remove('bg-secondary-container', 'text-on-secondary-container', 'border-outline-variant/20');
                    this.classList.add('bg-primary', 'text-on-primary', 'border-transparent');
                });
            });
        });
    </script>
<script>
        document.querySelector('button.bg-primary.text-on-primary.py-4').addEventListener('click', function() {
            const title = document.getElementById('proposal-title').value.trim();
            const category = document.querySelector('.flex.flex-wrap.gap-2 button.bg-primary').textContent.trim();
            const description = document.getElementById('proposal-idea').value.trim();

            if (!title || !description) {
                alert('Por favor, completa todos los campos.');
                return;
            }

            const today = new Date().toISOString().split('T')[0];
            let dailyCount = JSON.parse(localStorage.getItem('proposal_count_day')) || { date: today, count: 0 };

            if (dailyCount.date !== today) {
                dailyCount = { date: today, count: 0 };
            }

            if (dailyCount.count >= 2) {
                alert('Has alcanzado el límite de 2 propuestas por día.');
                return;
            }

            const proposals = JSON.parse(localStorage.getItem('school_proposals')) || [];
            const newProposal = {
                title,
                category,
                description,
                timestamp: new Date().toISOString()
            };

            proposals.push(newProposal);
            localStorage.setItem('school_proposals', JSON.stringify(proposals));

            dailyCount.count += 1;
            localStorage.setItem('proposal_count_day', JSON.stringify(dailyCount));

            window.location.href = 'exito.html';
        });
    </script><script>
        document.addEventListener('DOMContentLoaded', () => {

            const userName = userData?.name || localStorage.getItem('userName') || 'Estudiante';

            const settingsBtn = document.querySelector('header button');
            settingsBtn.addEventListener('click', () => {
                const menu = document.createElement('div');
                menu.className = 'fixed top-16 right-4 bg-surface-container-lowest border border-outline-variant/30 rounded-xl shadow-lg p-2 z-[60] flex flex-col gap-1 min-w-[160px]';

                    </button>
                `;
                
                const backdrop = document.createElement('div');
                backdrop.className = 'fixed inset-0 z-[55]';
                backdrop.onclick = () => { menu.remove(); backdrop.remove(); };
