<script>
        // Initialize Supabase
        const supabaseUrl = 'https://onjqxbyrtaknrirqulik.supabase.co';
        const supabaseKey = 'sb_publishable_v4IUYnEKDTckE6hFIKJBcg_nb1wZjbW';
        const supabase = supabasejs.createClient(supabaseUrl, supabaseKey);

        // Simple chip selection interaction
        document.addEventListener('DOMContentLoaded', () => {
            const chips = document.querySelectorAll('.category-btn');
            chips.forEach(chip => {
                chip.addEventListener('click', function(e) {
                    // Reset all chips
                    chips.forEach(c => {
                        c.classList.remove('active', 'bg-primary-container', 'text-white', 'border-transparent', 'shadow-[0_0_12px_rgba(0,102,204,0.4)]');
                        c.classList.add('bg-surface-container-lowest/50', 'text-on-surface-variant', 'border-glass-border', 'hover:bg-surface-container-low');
                    });
                    
                    // Set clicked chip to active
                    this.classList.remove('bg-surface-container-lowest/50', 'text-on-surface-variant', 'border-glass-border', 'hover:bg-surface-container-low');
                    this.classList.add('active', 'bg-primary-container', 'text-white', 'border-transparent', 'shadow-[0_0_12px_rgba(0,102,204,0.4)]');
                });
            });
        });

        // Submit to Supabase
        document.getElementById('submit-proposal').addEventListener('click', async function(e) {
            e.preventDefault();
            const title = document.getElementById('proposal-title').value.trim();
            const categoryElement = document.querySelector('.category-btn.active');
            const category = categoryElement ? categoryElement.getAttribute('data-value') : '';
            const description = document.getElementById('proposal-idea').value.trim();
            const student_name = localStorage.getItem('userName') || 'Usuario Anónimo';
            
            const submitBtn = document.getElementById('submit-proposal');
            const submitText = document.getElementById('submit-text');
            const originalText = submitText.textContent;
            const originalIcon = submitBtn.querySelector('.material-symbols-outlined').textContent;

            if (!title || !description) {
                alert('Por favor, completa todos los campos.');
                return;
            }

            // Set loading state
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-75', 'cursor-not-allowed');
            submitBtn.querySelector('.material-symbols-outlined').textContent = 'hourglass_empty';
            submitText.textContent = 'Enviando...';

            try {
                const { data, error } = await supabase
                    .from('propuestas')
                    .insert([
                        { titulo: title, categoria: category, descripcion: description, nombre_usuario: student_name }
                    ]);

                if (error) {
                    console.error('Error inserting data:', error);
                    alert('Hubo un error al enviar la propuesta. Inténtalo de nuevo.');
                    // Reset button state on error
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
                    submitBtn.querySelector('.material-symbols-outlined').textContent = originalIcon;
                    submitText.textContent = originalText;
                } else {
                    window.location.href = 'exito.html';
                }
            } catch (err) {
                console.error('Unexpected error:', err);
                alert('Ocurrió un error inesperado.');
                // Reset button state on error
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
                submitBtn.querySelector('.material-symbols-outlined').textContent = originalIcon;
                submitText.textContent = originalText;
            }
        });
    </script>
