<script>
        // Initialize Supabase
        const supabaseUrl = 'https://onjqxbyrtaknrirqulik.supabase.co';
        const supabaseKey = 'sb_publishable_v4IUYnEKDTckE6hFIKJBcg_nb1wZjbW';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
        console.log('Supabase client initialized');

        // Simple chip selection interaction
        document.addEventListener('DOMContentLoaded', () => {
            const chips = document.querySelectorAll('.flex.flex-wrap.gap-2 button');
            chips.forEach(chip => {
                chip.addEventListener('click', function(e) {
                    // Reset all chips
                    chips.forEach(c => {
                        c.classList.remove('bg-primary', 'text-on-primary', 'border-transparent', 'shadow-sm');
                        c.classList.add('bg-surface-container-lowest/50', 'text-on-secondary-container', 'border-outline-variant/30');
                    });
                    
                    // Set clicked chip to active
                    this.classList.remove('bg-surface-container-lowest/50', 'text-on-secondary-container', 'border-outline-variant/30');
                    this.classList.add('bg-primary', 'text-on-primary', 'border-transparent', 'shadow-sm');
                });
            });
        });

        // Submit to Supabase
        document.getElementById('proposal-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            console.log('Form submission intercepted');

            const title = document.getElementById('proposal-title').value.trim();
            const categoryElement = document.querySelector('.flex.flex-wrap.gap-2 button.bg-primary');
            const category = categoryElement ? categoryElement.textContent.trim() : '';
            const description = document.getElementById('proposal-idea').value.trim();
            const student_name = 'Anonymous'; // Default or fetch from auth if implemented

            console.log('Validating data:', { titulo: title, categoria: category, descripcion: description, estudiante: student_name });

            if (!title || !description) {
                console.warn('Validation failed: Missing title or description');
                alert('Por favor, completa todos los campos requeridos.');
                return;
            }

            try {
                console.log('Attempting to insert into Supabase "propuestas" table...');
                const { data, error } = await supabase
                    .from('propuestas')
                    .insert([
                        { titulo: title, categoria: category, descripcion: description, estudiante: student_name }
                    ]);

                if (error) {
                    console.error('Supabase insertion error:', error);
                    alert('Hubo un error al enviar la propuesta. Detalles: ' + error.message);
                } else {
                    console.log('Supabase insertion successful. Data:', data);
                    alert('Propuesta enviada con éxito!');
                    // Optionally redirect or clear form
                    // window.location.href = 'exito.html';
                    document.getElementById('proposal-title').value = '';
                    document.getElementById('proposal-idea').value = '';
                }
            } catch (err) {
                console.error('Unexpected error during Supabase interaction:', err);
                alert('Ocurrió un error inesperado al comunicarse con el servidor.');
            }
        });
    </script>
